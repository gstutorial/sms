<script>

const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1OP1z06rCpFMTRiAwncFIWuHK_rB2y0acy3KDVDnZGvA/export?format=csv&gid=0';
const TIME_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1OP1z06rCpFMTRiAwncFIWuHK_rB2y0acy3KDVDnZGvA/export?format=csv&gid=313461371';

let sectionData = {};
let globalTimeData = [];

function showToast(message){
    const toast = document.getElementById('toast');
    toast.innerHTML = message;
    toast.style.display='block';
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(()=>{
        toast.style.display='none';
    },3000);
}

function formatDisplayDate(dateString){
    const date = new Date(dateString);
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return String(date.getDate()).padStart(2,'0') + '-' + months[date.getMonth()] + '-' + date.getFullYear();
}

function toHindiDigits(num) {
    const hindiDigits = ['०','१','२','३','४','५','६','७','८','९'];
    return String(num).split('').map(d => hindiDigits[d] || d).join('');
}

// Robust CSV Fetcher handling quoted commas
async function fetchCSVData(url) {
    const response = await fetch(url);
    const csv = await response.text();
    const lines = csv.split('\n');
    const data = [];
    
    for(let i = 1; i < lines.length; i++){
        // Splits by comma, ignoring commas inside quotes
        const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
        if(row.length > 1){
            data.push(row.map(cell => cell ? cell.replace(/^"|"$/g, '').trim() : ''));
        }
    }
    return data;
}

async function generateReports(){

    const fromDateVal = document.getElementById('fromDate').value;
    const toDateVal = document.getElementById('toDate').value;

    if(!fromDateVal || !toDateVal){
        showToast('Please Select Date Range');
        return;
    }

    const fParts = fromDateVal.split('-');
    const from = new Date(fParts[0], fParts[1] - 1, fParts[2]);

    const tParts = toDateVal.split('-');
    const to = new Date(tParts[0], tParts[1] - 1, tParts[2]);
    
    to.setHours(23, 59, 59, 999);

    if(from > to){
        showToast('From Date Must Be Smaller');
        return;
    }

    document.getElementById('loading').style.display='block';
    document.getElementById('results').innerHTML='';

    // Fetch both Google Sheets concurrently
    const [rawMainData, rawTimeData] = await Promise.all([
        fetchCSVData(SHEET_URL),
        fetchCSVData(TIME_SHEET_URL)
    ]);

    // Parse Time Data globally
    globalTimeData = [];
    rawTimeData.forEach(row => {
        if(row.length >= 6) {
            globalTimeData.push({
                item: row[0],
                timeAllotted: row[5]
            });
        }
    });

    sectionData = {};

    rawMainData.forEach(row => {
        if(row.length >= 5 && row[0]) {
            const dateStr = row[0];
            const p = dateStr.split('/');
            const rowDate = new Date(p[2], p[1]-1, p[0]);

            if(rowDate >= from && rowDate <= to){
                const section = row[1];
                if(!sectionData[section]) sectionData[section] = [];
                
                sectionData[section].push({
                    date: dateStr,
                    item: row[2],
                    quantity: Number(row[3]),
                    thickness: row[4]
                });
            }
        }
    });

    renderCards();
    document.getElementById('loading').style.display='none';
    showToast('Reports Generated Successfully');
}

function renderCards(){
    const container = document.getElementById('results');
    container.innerHTML='';

    const allCard = document.createElement('div');
    allCard.className = 'section-card all-card';

    // Added new button row for the Time Earn Report inside the All Sections Card
    allCard.innerHTML = `
    <div class="section-header">
        <div class="section-icon">📚</div>
        <div class="section-name">ALL SECTIONS</div>
    </div>
    <div class="button-row">
        <button class="download-btn" onclick="downloadAllPDF()">⬇ Download</button>
        <button class="share-btn" onclick="shareAllPDF()">🔗 Share</button>
    </div>
    <div class="button-row" style="margin-top: 10px;">
        <button class="download-btn" onclick="downloadTimeEarnPDF()" style="background: linear-gradient(135deg, #f59e0b, #d97706); width: 100%;">
            ⏱ Download Time Earn Report
        </button>
    </div>
    `;
    container.appendChild(allCard);

    Object.keys(sectionData).forEach(section=>{
        const rows = sectionData[section];
        let totalQty = 0;
        rows.forEach(r => totalQty += Number(r.quantity));
        const uniqueItems = [...new Set(rows.map(r=>r.item))];

        const card = document.createElement('div');
        card.className = 'section-card';
        card.innerHTML = `
        <div class="section-header">
            <div class="section-icon">📋</div>
            <div class="section-name">${section}</div>
        </div>
        <div class="summary-grid">
            <div class="summary-box">
                <div class="summary-number">${rows.length}</div>
                <div class="summary-label">Entries</div>
            </div>
            <div class="summary-box">
                <div class="summary-number">${totalQty}</div>
                <div class="summary-label">Qty</div>
            </div>
            <div class="summary-box">
                <div class="summary-number">${uniqueItems.length}</div>
                <div class="summary-label">Items</div>
            </div>
        </div>
        <div class="button-row">
            <button class="download-btn" onclick="downloadPDF('${section}')">⬇ Download</button>
            <button class="share-btn" onclick="sharePDF('${section}')">🔗 Share</button>
        </div>
        `;
        container.appendChild(card);
    });
}

// ----------------------------------------------------
// PDF GENERATION: Original Standard Reports
// ----------------------------------------------------

function createSectionPDF(doc, section, rows) {
    const fromDateVal = document.getElementById('fromDate').value;
    const fParts = fromDateVal.split('-');
    const fromDate = formatDisplayDate(`${fParts[0]}-${fParts[1]}-${fParts[2]}T00:00:00`);

    const toDateVal = document.getElementById('toDate').value;
    const tParts = toDateVal.split('-');
    const toDate = formatDisplayDate(`${tParts[0]}-${tParts[1]}-${tParts[2]}T00:00:00`);
    
    const startPage = doc.internal.getCurrentPageInfo().pageNumber;

    rows.sort((a,b)=>{
        const pa = a.date.split('/');
        const pb = b.date.split('/');
        return new Date(pa[2],pa[1]-1,pa[0]) - new Date(pb[2],pb[1]-1,pb[0]);
    });

    const summary = {};
    rows.forEach(r => {
        const key = r.item + '|' + r.thickness;
        if(!summary[key]){ summary[key]=0; }
        summary[key] += Number(r.quantity);
    });
    
    const summaryRows = Object.keys(summary).map(key => {
        const p = key.split('|');
        return [p[0], p[1], summary[key]];
    });

    const dateCounts = {};
    rows.forEach(r => {
        dateCounts[r.date] = (dateCounts[r.date] || 0) + 1;
    });

    const bodyRows = [];
    let currentGroup = -1;
    let previousDate = '';

    rows.forEach(r => {
        let displayDate = formatDisplayDate(r.date.split('/').reverse().join('-') + 'T00:00:00');

        if (r.date !== previousDate) {
            currentGroup++;
            bodyRows.push({
                row: [
                    { content: displayDate, rowSpan: dateCounts[r.date], styles: { valign: 'middle', halign: 'center', fontStyle: 'bold' } },
                    r.item,
                    r.thickness,
                    r.quantity
                ],
                group: currentGroup
            });
            previousDate = r.date;
        } else {
            bodyRows.push({
                row: [
                    r.item,
                    r.thickness,
                    r.quantity
                ],
                group: currentGroup
            });
        }
    });

    doc.setTextColor(25, 35, 55);
    doc.setFontSize(13);
    doc.setFont('helvetica', 'bold');
    doc.text('Detail Work Report', 3, 46);
    doc.text('Item Summary', 126, 46);

    doc.autoTable({
        startY: 48,
        margin: { top: 48, bottom: 15, left: 3, right: 87 }, 
        head: [['Date', 'Description', 'Thick.', 'Qty']],
        body: bodyRows.map(r => r.row),
        theme: 'grid',
        styles: {
            fontSize: 7.5,
            cellPadding: 2.5,
            lineColor: [200, 200, 200],
            lineWidth: 0.1,
            valign: 'middle'
        },
        headStyles: {
            textColor: [255, 255, 255],
            fontStyle: 'bold',
            halign: 'center'
        },
        columnStyles: {
            0: { cellWidth: 22, halign: 'center', fontStyle: 'bold' },
            1: { cellWidth: 65 }, 
            2: { cellWidth: 18, halign: 'center' },
            3: { cellWidth: 15, halign: 'center', fontStyle: 'bold' }
        },
        didParseCell: function(data) {
            if (data.section === 'head') { data.cell.styles.fillColor = null; }
            if (data.section === 'body') {
                const rowData = bodyRows[data.row.index];
                const bgColor = rowData.group % 2 === 0 ? [255, 255, 255] : [235, 243, 255]; 
                data.cell.styles.fillColor = bgColor;
            }
        },
        willDrawCell: function(data) {
            if (data.section === 'head') {
                const { x, y, width, height } = data.cell;
                for (let i = 0; i <= height; i += 0.5) {
                    let ratio = i / height;
                    let r = Math.round(15 + (30 - 15) * ratio); 
                    let g = Math.round(23 + (58 - 23) * ratio); 
                    let b = Math.round(42 + (138 - 42) * ratio); 
                    doc.setFillColor(r, g, b);
                    doc.rect(x, y + i, width, 0.6, 'F');
                }
            }
        }
    });

    doc.setPage(startPage); 

    doc.autoTable({
        startY: 48,
        margin: { top: 48, bottom: 15, left: 126, right: 3 },
        head: [['Item Description', 'Thick.', 'Total Qty']],
        body: summaryRows,
        theme: 'grid',
        styles: {
            fontSize: 7.5,
            cellPadding: 2.5,
            lineColor: [200, 200, 200],
            lineWidth: 0.1,
            valign: 'middle'
        },
        headStyles: {
            textColor: [255, 255, 255],
            fontStyle: 'bold',
            halign: 'center'
        },
        columnStyles: {
            0: { cellWidth: 46 }, 
            1: { cellWidth: 18, halign: 'center' },
            2: { cellWidth: 17, halign: 'center', fontStyle: 'bold' }
        },
        didParseCell: function(data) {
            if (data.section === 'head') { data.cell.styles.fillColor = null; }
            if (data.section === 'body') {
                const bgColor = data.row.index % 2 === 0 ? [255, 255, 255] : [240, 248, 245]; 
                data.cell.styles.fillColor = bgColor;
            }
        },
        willDrawCell: function(data) {
            if (data.section === 'head') {
                const { x, y, width, height } = data.cell;
                for (let i = 0; i <= height; i += 0.5) {
                    let ratio = i / height;
                    let r = Math.round(2 + (4 - 2) * ratio);   
                    let g = Math.round(44 + (120 - 44) * ratio); 
                    let b = Math.round(34 + (87 - 34) * ratio);  
                    doc.setFillColor(r, g, b);
                    doc.rect(x, y + i, width, 0.6, 'F');
                }
            }
        }
    });

    const endPage = doc.internal.getNumberOfPages();
    const pageHeight = doc.internal.pageSize.height;
    
    for (let i = startPage; i <= endPage; i++) {
        doc.setPage(i);
        
        const headerHeight = 36;
        for (let y = 0; y <= headerHeight; y += 0.5) {
            let ratio = y / headerHeight;
            let r = Math.round(15 + (13 - 15) * ratio);
            let g = Math.round(23 + (148 - 23) * ratio);
            let b = Math.round(42 + (136 - 42) * ratio);
            doc.setFillColor(r, g, b);
            doc.rect(0, y, 210, 0.6, 'F'); 
        }

        try {
            const img = document.querySelector('.logo');
            if(img) doc.addImage(img, 'PNG', 3, 4, 28, 28);
        } catch(e) {}

        doc.setTextColor(255, 255, 255);
        doc.setFontSize(22);
        doc.setFont('helvetica', 'bold');
        doc.text('SMS WORK REPORT', 105, 14, {align:'center'});

        doc.setFontSize(9);
        doc.setTextColor(220, 230, 240);
        doc.setFont('helvetica', 'normal');
        doc.text('App Created By Gobind Sharma', 105, 20, {align:'center'});

        doc.setFontSize(10);
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(255, 255, 255);
        const infoText = `SECTION: ${section}     |     FROM: ${fromDate}     |     TO: ${toDate}`;
        doc.text(infoText, 105, 30, {align:'center'});

        doc.setDrawColor(220, 220, 220);
        doc.setLineWidth(0.5);
        doc.line(3, pageHeight - 10, 207, pageHeight - 10);
        doc.setFontSize(9);
        doc.setTextColor(120, 120, 120);
        doc.setFont('helvetica', 'normal');
        doc.text('Indian Railway Work Report System', 105, pageHeight - 4, { align: 'center' });
    }
}

async function createPDF(section){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('portrait');
    createSectionPDF(doc, section, sectionData[section]);
    return doc.output('blob');
}

async function downloadPDF(section){
    const blob = await createPDF(section);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = section + '.pdf';
    a.click();
}

async function sharePDF(section){
    const blob = await createPDF(section);
    const file = new File([blob], section + '.pdf', { type:'application/pdf' });
    if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({ files:[file] });
    } else {
        showToast('Sharing Not Supported');
    }
}

async function createAllPDF(){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('portrait');
    const sections = Object.keys(sectionData);

    sections.forEach((section,index)=>{
        if(index !== 0) doc.addPage();
        createSectionPDF(doc, section, sectionData[section]);
    });
    return doc.output('blob');
}

async function downloadAllPDF(){
    const blob = await createAllPDF();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'All Sections Report.pdf';
    a.click();
}

async function shareAllPDF(){
    const blob = await createAllPDF();
    const file = new File([blob], 'All Sections Report.pdf', { type:'application/pdf' });
    if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({ files:[file] });
    } else {
        showToast('Sharing Not Supported');
    }
}

// ----------------------------------------------------
// PDF GENERATION: NEW Time Earn Report Logic
// ----------------------------------------------------

function findTimeAllotted(itemName) {
    let search = itemName.trim().toLowerCase();
    
    // 1. Exact match
    let found = globalTimeData.find(t => t.item.trim().toLowerCase() === search);
    if(found && !isNaN(parseFloat(found.timeAllotted))) return parseFloat(found.timeAllotted);

    // 2. First and second word match (Partial matching)
    let words = search.split(/\s+/);
    if (words.length >= 2) {
        let prefix = words[0] + ' ' + words[1];
        found = globalTimeData.find(t => t.item.trim().toLowerCase().startsWith(prefix));
        if(found && !isNaN(parseFloat(found.timeAllotted))) return parseFloat(found.timeAllotted);
    }

    // 3. First word fallback
    if (words.length >= 1) {
        let prefix = words[0];
        found = globalTimeData.find(t => t.item.trim().toLowerCase().startsWith(prefix));
        if(found && !isNaN(parseFloat(found.timeAllotted))) return parseFloat(found.timeAllotted);
    }

    return 0; // Default if completely unmatched
}

async function createTimeEarnPDFBlob() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('portrait');

    // Aggregate Items across ALL sections
    let itemAggregates = {};
    Object.keys(sectionData).forEach(sec => {
        sectionData[sec].forEach(row => {
            let item = row.item.trim();
            if(!itemAggregates[item]) {
                itemAggregates[item] = 0;
            }
            itemAggregates[item] += Number(row.quantity);
        });
    });

    // Generate table body arrays
    let bodyRows = [];
    Object.keys(itemAggregates).forEach(item => {
        let qty = itemAggregates[item];
        let timePerUnit = findTimeAllotted(item);
        let totalTime = (qty * timePerUnit).toFixed(3);
        
        bodyRows.push([
            item,
            "",
            "",
            "",
            qty.toString(),
            totalTime
        ]);
    });

    // Date Logic for Header Month String
    const toDateVal = document.getElementById('toDate').value;
    const tParts = toDateVal.split('-');
    const tDate = new Date(tParts[0], tParts[1] - 1, tParts[2]);

    const engMonths = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const hinMonths = ['जनवरी','फरवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर'];

    const mIndex = tDate.getMonth();
    const yearStr = String(tDate.getFullYear());
    const engMonthStr = engMonths[mIndex];
    const hinMonthStr = hinMonths[mIndex];
    const hinYearStr = toHindiDigits(yearStr);

    // Document Titles and Header
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    doc.text('Annexure II', 200, 15, { align: 'right' });
    
    doc.setFontSize(14);
    doc.setFont('helvetica', 'bold');
    doc.text(`${hinMonthStr} महीने ${hinYearStr} के लिए महत्वपूर्ण भागों का प्रदर्शन`, 105, 25, { align: 'center' });
    
    doc.setFontSize(11);
    doc.setFont('helvetica', 'normal');
    doc.text(`Performance of important sections for the month of ${engMonthStr}-${yearStr}`, 105, 32, { align: 'center' });

    // Render Exact Match Table Design
    doc.autoTable({
        startY: 38,
        head: [
            [
                { content: 'Description of Materials', rowSpan: 2, styles: { halign: 'center', valign: 'middle' } },
                { content: 'Received\nduring the\nmonth', rowSpan: 2, styles: { halign: 'center', valign: 'middle' } },
                { content: 'Assistance given to (in Nos)', colSpan: 3, styles: { halign: 'center', valign: 'middle' } },
                { content: 'Allowed man\nhours consumed\n(in m/hrs)', rowSpan: 2, styles: { halign: 'center', valign: 'middle' } }
            ],
            [
                { content: 'Division', styles: { halign: 'center' } },
                { content: 'Store', styles: { halign: 'center' } },
                { content: 'Shop & shop', styles: { halign: 'center' } }
            ]
        ],
        body: bodyRows,
        theme: 'grid',
        styles: {
            fontSize: 7.5,
            textColor: [0, 0, 0],
            lineColor: [0, 0, 0],
            lineWidth: 0.1,
            cellPadding: 1.5,
            valign: 'middle'
        },
        headStyles: {
            fillColor: [255, 255, 255],
            textColor: [0, 0, 0],
            fontStyle: 'bold'
        },
        columnStyles: {
            0: { cellWidth: 70 },
            1: { cellWidth: 20, halign: 'center' },
            2: { cellWidth: 20, halign: 'center' },
            3: { cellWidth: 20, halign: 'center' },
            4: { cellWidth: 25, halign: 'center' },
            5: { cellWidth: 35, halign: 'center' }
        }
    });

    // Footer Info
    let finalY = doc.lastAutoTable.finalY + 15;
    const pageHeight = doc.internal.pageSize.height;
    if (finalY > pageHeight - 20) {
        doc.addPage();
        finalY = 20;
    }

    doc.setFontSize(10);
    doc.setFont('helvetica', 'bold');
    doc.text('वरिष्ठ अनुभाग अभियंता / प्रभारी / बी एस एस / न्यू बंगाईगांव', 198, finalY, { align: 'right' });
    doc.text('SSE/IC/BSS/NBQS', 198, finalY + 6, { align: 'right' });

    return doc.output('blob');
}

async function downloadTimeEarnPDF() {
    if (Object.keys(sectionData).length === 0) {
        showToast('No data available to generate report');
        return;
    }
    
    const blob = await createTimeEarnPDFBlob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'All_Section_Time_Earn_Report.pdf';
    a.click();
}

let deferredPrompt;
const installBtn = document.getElementById('installAppBtn');

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'flex';
});

installBtn.addEventListener('click', async () => {
    installBtn.style.display = 'none';
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
});

window.addEventListener('appinstalled', () => {
    deferredPrompt = null;
    showToast('App Installed Successfully!');
});

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => {
            console.log('SW registration failed:', err);
        });
    });
}
