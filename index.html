<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background: radial-gradient(circle at top, #1e3a8a 0%, #0f172a 40%, #020617 100%);
    min-height:100vh;

.container{
    width:100%;
    max-width:1500px;
    margin:auto;
    background: linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04));

    padding:18px;
    border: 1px solid rgba(255,255,255,0.10);

.logo{

}

.title{

}

.subtitle{
    text-align:center;

    font-size:14px;
}

.creator-text {
    margin-top: 5px;

}

.main-layout{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.input-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    animation: fadeIn 0.4s ease-in-out;
}

.filter-box{
    width: 100%;
    max-width: 450px; /* Centers nicely on desktop */
    background: rgba(255,255,255,0.06);
    border-radius:24px;
    padding:18px;

}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }

.input-group{

.input-label{

/* --- CUSTOM DATE PICKER STYLES --- */
.date-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    background: white;
    border-radius: 15px;
    overflow: hidden;
}

.date-icon {
    position: absolute;
    left: 14px;
    color: #6366f1;

    pointer-events: none;
}

.date-input {
    width: 100%;

    border: none;
    background: transparent;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    color: #1f2937;
    outline: none;
}

.date-input::-webkit-calendar-picker-indicator {
    background: transparent;
    color: transparent;
    cursor: pointer;
    height: 100%;
    width: 100%;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    opacity: 0;
}
/* ------------------------------------ */

.action-buttons{
    display:flex;
    gap:10px;

}

.default-btn{

.masonry-col {

.card-header-toggle {

.section-name{

.summary-box{

.download-btn{

/* Premium Dark Gradient for ALL SECTIONS Card */

}

.back-btn {

    max-width: 450px;
    margin: 20px auto 0;

    border: 1px solid rgba(255, 255, 255, 0.2);

    font-size: 16px;
    font-weight: 800;

    display: flex;
    align-items: center;

}

.back-btn:hover {

}

.footer{

#toast{
    position:fixed;

    transform:translateX(-50%);
    background: linear-gradient(135deg, #111827, #1f2937);

    color:white;

.install-fab {

.install-fab:hover {

@media(min-width:992px){

    Generate Section Wise Work Reports

<div class="main-layout">

    <div class="input-section" id="inputSection">
        <div class="filter-box">
            <div class="input-group">
                <label class="input-label">From Date</label>
                <div class="date-wrapper">
                    <div class="date-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                    <div class="date-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                    </div>

<script>

const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1OP1z06rCpFMTRiAwncFIWuHK_rB2y0acy3KDVDnZGvA/export?format=csv&gid=0';
const TIME_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1OP1z06rCpFMTRiAwncFIWuHK_rB2y0acy3KDVDnZGvA/export?format=csv&gid=313461371';

let sectionData = {};
let globalTimeData = [];

function showToast(message){
    const toast = document.getElementById('toast');
    toast.innerHTML = message;
    toast.style.display='block';
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(()=>{
        toast.style.display='none';
    },3000);
}

function formatDisplayDate(dateString){
    const date = new Date(dateString);
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return String(date.getDate()).padStart(2,'0') + '-' + months[date.getMonth()] + '-' + date.getFullYear();
}

function getMonthYearString() {
    const toDateVal = document.getElementById('toDate').value;
    if(!toDateVal) return "";
    const tParts = toDateVal.split('-');
    const tDate = new Date(tParts[0], tParts[1] - 1, tParts[2]);
    const engMonths = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    return `${engMonths[tDate.getMonth()]} ${tDate.getFullYear()}`;
}

function toHindiDigits(num) {
    const hindiDigits = ['०','१','२','३','४','५','६','७','८','९'];
    return String(num).split('').map(d => hindiDigits[d] || d).join('');
}

function addHindiText(doc, text, y, ptSize, isBold, align='left', rightMargin=200) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const scale = 4;
    const pxSize = ptSize * (96/72) * scale;
    ctx.font = `${isBold ? 'bold' : 'normal'} ${pxSize}px Arial, sans-serif`;
    
    const metrics = ctx.measureText(text);
    canvas.width = metrics.width + 20;
    canvas.height = pxSize * 2;
    
    ctx.font = `${isBold ? 'bold' : 'normal'} ${pxSize}px Arial, sans-serif`;
    ctx.fillStyle = '#000000';
    ctx.textBaseline = 'top';
    ctx.fillText(text, 10, 10);
    
    const imgData = canvas.toDataURL('image/png');
    const widthMm = (canvas.width / scale) * (25.4 / 96);
    const heightMm = (canvas.height / scale) * (25.4 / 96);
    
    let xPos = 10;
    if(align === 'center') xPos = 105 - (widthMm / 2);
    else if(align === 'right') xPos = rightMargin - widthMm;
    
    doc.addImage(imgData, 'PNG', xPos, y - (heightMm * 0.1), widthMm, heightMm);
}

function setDefaultDates() {
    const today = new Date();
    const year = today.getFullYear();
    const month = today.getMonth(); 
    
    const fromDateObj = new Date(year, month - 1, 17);
    const toDateObj = new Date(year, month, 16);

    const formatForInput = (d) => {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    };

    document.getElementById('fromDate').value = formatForInput(fromDateObj);
    document.getElementById('toDate').value = formatForInput(toDateObj);
}

async function fetchCSVData(url) {
    const response = await fetch(url);
    const csv = await response.text();
    const lines = csv.split('\n');
    const data = [];
    
    for(let i = 1; i < lines.length; i++){
        const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
        if(row.length > 1){
            data.push(row.map(cell => cell ? cell.replace(/^"|"$/g, '').trim() : ''));
        }
    }
    return data;
}

async function generateReports(){
    const fromDateVal = document.getElementById('fromDate').value;
    const toDateVal = document.getElementById('toDate').value;

    if(!fromDateVal || !toDateVal){
        showToast('Please Select Date Range');
        return;
    }

    const fParts = fromDateVal.split('-');
    const from = new Date(fParts[0], fParts[1] - 1, fParts[2]);

    const tParts = toDateVal.split('-');
    const to = new Date(tParts[0], tParts[1] - 1, tParts[2]);
    to.setHours(23, 59, 59, 999);

    if(from > to){
        showToast('From Date Must Be Smaller');
        return;
    }

    document.getElementById('loading').style.display='block';
    document.getElementById('results').innerHTML='';

    const [rawMainData, rawTimeData] = await Promise.all([
        fetchCSVData(SHEET_URL),
        fetchCSVData(TIME_SHEET_URL)
    ]);

    globalTimeData = [];
    rawTimeData.forEach(row => {
        if(row.length >= 6) {
            globalTimeData.push({
                item: row[0],
                timeAllotted: row[5]
            });
        }
    });

    sectionData = {};

    rawMainData.forEach(row => {
        if(row.length >= 5 && row[0]) {
            const dateStr = row[0];
            const p = dateStr.split('/');
            const rowDate = new Date(p[2], p[1]-1, p[0]);

            if(rowDate >= from && rowDate <= to){
                const section = row[1];
                if(!sectionData[section]) sectionData[section] = [];
                
                sectionData[section].push({
                    date: dateStr,
                    item: row[2],
                    quantity: Number(row[3]),
                    thickness: row[4]
                });
            }
        }
    });

    renderCards();
    
    // Switch Views
    document.getElementById('loading').style.display='none';
    document.getElementById('inputSection').style.display='none';
    document.getElementById('resultsSection').style.display='block';
    
    showToast('Reports Generated Successfully');
}

// Function to return to input screen and reset
function goBackToInput() {
    document.getElementById('resultsSection').style.display = 'none';
    document.getElementById('inputSection').style.display = 'flex';
    document.getElementById('results').innerHTML = '';
    
    // Reset dates
    document.getElementById('fromDate').value = '';
    document.getElementById('toDate').value = '';
}

function toggleCard(bodyId, arrowId) {
    const targetBody = document.getElementById(bodyId);
    const targetArrow = document.getElementById(arrowId);
    
    const isCurrentlyClosed = (targetBody.style.display === 'none' || targetBody.style.display === '');

    const allBodies = document.querySelectorAll('.card-collapsible');
    const allArrows = document.querySelectorAll('.toggle-arrow');
    
    allBodies.forEach(body => {
        body.style.display = 'none';
    });
    
    allArrows.forEach(arrow => {
        arrow.classList.remove('rotate-arrow');
    });

    if (isCurrentlyClosed) {
        targetBody.style.display = 'block';
        targetArrow.classList.add('rotate-arrow');
    }
}

function renderCards(){
    const container = document.getElementById('results');
    container.innerHTML='';

    // Calculate Grand Total Time Earned & Track Missing Time Items
    let totalTimeEarned = 0;
    let itemAggregates = {};
    let missingTimeItems = new Set();

    Object.keys(sectionData).forEach(sec => {
        sectionData[sec].forEach(row => {
            let item = row.item.trim();
            if(!itemAggregates[item]) itemAggregates[item] = 0;
            itemAggregates[item] += Number(row.quantity);
        });
    });
    Object.keys(itemAggregates).forEach(item => {
        let timePerUnit = findTimeAllotted(item);
        if (timePerUnit === 0) {
            missingTimeItems.add(item); // Item has no time allotted value
        }
        totalTimeEarned += (itemAggregates[item] * timePerUnit);
    });
    const formattedTotalTime = totalTimeEarned.toFixed(3);

    // Prepare Missing Items HTML if there are any
    let missingItemsHtml = '';
    if (missingTimeItems.size > 0) {
        const itemsList = Array.from(missingTimeItems).join('  •  ');
        missingItemsHtml = `
            <div style="margin-bottom: 12px; padding: 12px; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.25); border-radius: 14px;">
                <div style="color: #fca5a5; font-size: 13px; font-weight: 700; margin-bottom: 5px; display: flex; align-items: center; gap: 6px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                    Items Missing Time Allotted Value:
                </div>
                <div style="color: #fecaca; font-size: 11px; line-height: 1.5; font-weight: 600;">
                    ${itemsList}
                </div>
            </div>
        `;
    }

    // 1. Create ALL SECTIONS card (Full Width at Top)
    const allCard = document.createElement('div');
    allCard.className = 'section-card all-card';

    allCard.innerHTML = `
    <div class="card-header-toggle" onclick="toggleCard('body-all', 'arrow-all')">
        <div class="header-left">
            <div class="section-icon">📚</div>
            <div class="section-name">ALL SECTIONS</div>
        </div>
        <div class="header-right">
            <div class="toggle-arrow" id="arrow-all">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
        </div>
    </div>
    <div class="card-collapsible" id="body-all">
        <div class="summary-grid" style="grid-template-columns: 1fr; margin-bottom: 12px;">

function createSectionPDF(doc, section, rows) {
    const fromDateVal = document.getElementById('fromDate').value;
    const fParts = fromDateVal.split('-');
    const fromDate = formatDisplayDate(`${fParts[0]}-${fParts[1]}-${fParts[2]}T00:00:00`);

    const toDateVal = document.getElementById('toDate').value;
    const tParts = toDateVal.split('-');
    const toDate = formatDisplayDate(`${tParts[0]}-${tParts[1]}-${tParts[2]}T00:00:00`);
    
    const startPage = doc.internal.getCurrentPageInfo().pageNumber;

    rows.sort((a,b)=>{
        const pa = a.date.split('/');
        const pb = b.date.split('/');
        return new Date(pa[2],pa[1]-1,pa[0]) - new Date(pb[2],pb[1]-1,pb[0]);
    });

    const summary = {};
    rows.forEach(r => {
        const key = r.item + '|' + r.thickness;
        if(!summary[key]){ summary[key]=0; }
        summary[key] += Number(r.quantity);
    });
    
    const summaryRows = Object.keys(summary).map(key => {
        const p = key.split('|');
        return [p[0], p[1], summary[key]];
    });

    const dateCounts = {};
    rows.forEach(r => {
        dateCounts[r.date] = (dateCounts[r.date] || 0) + 1;
    });

    const bodyRows = [];
    let currentGroup = -1;
    let previousDate = '';

    rows.forEach(r => {
        let displayDate = formatDisplayDate(r.date.split('/').reverse().join('-') + 'T00:00:00');

        if (r.date !== previousDate) {
            currentGroup++;
            bodyRows.push({
                row: [
                    { content: displayDate, rowSpan: dateCounts[r.date], styles: { valign: 'middle', halign: 'center', fontStyle: 'bold' } },
                    r.item,
                    r.thickness,
                    r.quantity
                ],
                group: currentGroup
            });
            previousDate = r.date;
        } else {
            bodyRows.push({
                row: [
                    r.item,
                    r.thickness,
                    r.quantity
                ],
                group: currentGroup
            });
        }
    });

    doc.setTextColor(25, 35, 55);
    doc.setFontSize(13);
    doc.setFont('helvetica', 'bold');
    doc.text('Detail Work Report', 3, 38);
    doc.text('Item Summary', 126, 38);

    doc.autoTable({
        startY: 40,
        margin: { top: 40, bottom: 12, left: 3, right: 87 }, 
        head: [['Date', 'Description', 'Thick.', 'Qty']],
        body: bodyRows.map(r => r.row),
        theme: 'grid',
        styles: { fontSize: 7.5, cellPadding: 2.5, lineColor: [200, 200, 200], lineWidth: 0.1, valign: 'middle' },
        headStyles: { textColor: [255, 255, 255], fontStyle: 'bold', halign: 'center', lineWidth: 0 },
        columnStyles: {
            0: { cellWidth: 22, halign: 'center', fontStyle: 'bold' },
            1: { cellWidth: 65 }, 
            2: { cellWidth: 18, halign: 'center' },
            3: { cellWidth: 15, halign: 'center', fontStyle: 'bold' }
        },
        didParseCell: function(data) {
            if (data.section === 'head') { 
                data.cell.styles.fillColor = null; 
                data.cell.styles.lineWidth = 0;
            }
            if (data.section === 'body') {
                const rowData = bodyRows[data.row.index];
                const bgColor = rowData.group % 2 === 0 ? [255, 255, 255] : [235, 243, 255]; 
                data.cell.styles.fillColor = bgColor;
            }
        },
        willDrawCell: function(data) {
            if (data.section === 'head') {
                let tableW = 120; // 210 (page) - 3 (left margin) - 87 (right margin)
                let relativeX = data.cell.x - 3;
                
                for (let i = 0; i <= data.cell.width; i += 0.5) { 
                    let ratio = (relativeX + i) / tableW;
                    ratio = Math.max(0, Math.min(1, ratio));
                    
                    let r = Math.round(30 + (37 - 30) * ratio);
                    let g = Math.round(58 + (99 - 58) * ratio);
                    let b = Math.round(138 + (235 - 138) * ratio);
                    
                    doc.setFillColor(r, g, b);
                    let rectWidth = Math.min(0.6, data.cell.width - i);
                    doc.rect(data.cell.x + i, data.cell.y, rectWidth, data.cell.height, 'F');
                }
            }
        }
    });

    doc.setPage(startPage); 

    doc.autoTable({
        startY: 40,
        margin: { top: 40, bottom: 12, left: 126, right: 3 },
        head: [['Item Description', 'Thick.', 'Total Qty']],
        body: summaryRows,
        theme: 'grid',
        styles: { fontSize: 7.5, cellPadding: 2.5, lineColor: [200, 200, 200], lineWidth: 0.1, valign: 'middle' },
        headStyles: { textColor: [255, 255, 255], fontStyle: 'bold', halign: 'center', lineWidth: 0 },
        columnStyles: {
            0: { cellWidth: 46 }, 
            1: { cellWidth: 18, halign: 'center' },
            2: { cellWidth: 17, halign: 'center', fontStyle: 'bold' }
        },
        didParseCell: function(data) {
            if (data.section === 'head') { 
                data.cell.styles.fillColor = null; 
                data.cell.styles.lineWidth = 0; 
            }
            if (data.section === 'body') {
                const bgColor = data.row.index % 2 === 0 ? [255, 255, 255] : [240, 248, 245]; 
                data.cell.styles.fillColor = bgColor;
            }
        },
        willDrawCell: function(data) {
            if (data.section === 'head') {
                let tableW = 81; // 210 (page) - 126 (left margin) - 3 (right margin)
                let relativeX = data.cell.x - 126;
                
                for (let i = 0; i <= data.cell.width; i += 0.5) { 
                    let ratio = (relativeX + i) / tableW;
                    ratio = Math.max(0, Math.min(1, ratio));
                    
                    let r = Math.round(30 + (37 - 30) * ratio);
                    let g = Math.round(58 + (99 - 58) * ratio);
                    let b = Math.round(138 + (235 - 138) * ratio);
                    
                    doc.setFillColor(r, g, b);
                    let rectWidth = Math.min(0.6, data.cell.width - i);
                    doc.rect(data.cell.x + i, data.cell.y, rectWidth, data.cell.height, 'F');
                }
            }
        }
    });

    const endPage = doc.internal.getNumberOfPages();
    const pageHeight = doc.internal.pageSize.height;
    
    for (let i = startPage; i <= endPage; i++) {
        doc.setPage(i);
        
        const headerHeight = 30;
        for (let x = 0; x <= 210; x += 0.5) {
            let ratio = x / 210;
            let r = Math.round(15 + (30 - 15) * ratio);  
            let g = Math.round(23 + (58 - 23) * ratio);
            let b = Math.round(42 + (138 - 42) * ratio);
            doc.setFillColor(r, g, b);
            doc.rect(x, 0, 0.6, headerHeight, 'F'); 
        }

        const footerHeight = 12;
        const footerY = pageHeight - footerHeight;
        for (let x = 0; x <= 210; x += 0.5) {
            let ratio = x / 210;
            let r = Math.round(15 + (30 - 15) * ratio);
            let g = Math.round(23 + (58 - 23) * ratio);
            let b = Math.round(42 + (138 - 42) * ratio);
            doc.setFillColor(r, g, b);
            doc.rect(x, footerY, 0.6, footerHeight, 'F'); 
        }

        try {
            const img = document.querySelector('.logo');
            if(img) doc.addImage(img, 'PNG', 3, 2, 26, 26);
        } catch(e) {}

        doc.setTextColor(255, 255, 255);
        doc.setFontSize(20);
        doc.setFont('helvetica', 'bold');
        doc.text('SMS WORK REPORT', 105, 12, {align:'center'});

        doc.setFontSize(9);
        doc.setTextColor(220, 230, 240);
        doc.setFont('helvetica', 'normal');
        doc.text('App Created By Gobind Sharma', 105, 17, {align:'center'});

        doc.setFontSize(10);
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(255, 255, 255);
        const infoText = `SECTION: ${section}     |     FROM: ${fromDate}     |     TO: ${toDate}`;
        doc.text(infoText, 105, 25, {align:'center'});

        doc.setFontSize(9);
        doc.setTextColor(230, 240, 250);
        doc.setFont('helvetica', 'normal');
        doc.text('SSE/BSS/NBQS Work Report System', 105, pageHeight - 4.5, { align: 'center' });
    }
}

async function createPDF(section){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('portrait');
    createSectionPDF(doc, section, sectionData[section]);
    return doc.output('blob');
}

async function downloadPDF(section){
    const blob = await createPDF(section);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${section} ${getMonthYearString()}.pdf`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
}

async function sharePDF(section){
    const blob = await createPDF(section);
    const filename = `${section} ${getMonthYearString()}.pdf`;
    const file = new File([blob], filename, { type:'application/pdf' });
    if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({ files:[file] });
    } else {
        showToast('Sharing Not Supported');
    }
}

function findTimeAllotted(itemName) {
    let search = itemName.trim().toLowerCase();
    
    let found = globalTimeData.find(t => t.item.trim().toLowerCase() === search);
    if(found && !isNaN(parseFloat(found.timeAllotted))) return parseFloat(found.timeAllotted);

    let words = search.split(/\s+/);
    if (words.length >= 2) {
        let prefix = words[0] + ' ' + words[1];
        found = globalTimeData.find(t => t.item.trim().toLowerCase().startsWith(prefix));
        if(found && !isNaN(parseFloat(found.timeAllotted))) return parseFloat(found.timeAllotted);
    }

    if (words.length >= 1) {
        let prefix = words[0];
        found = globalTimeData.find(t => t.item.trim().toLowerCase().startsWith(prefix));
        if(found && !isNaN(parseFloat(found.timeAllotted))) return parseFloat(found.timeAllotted);
    }

    return 0; 
}

async function createTimeEarnPDFBlob() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('portrait');

    let itemAggregates = {};
    Object.keys(sectionData).forEach(sec => {
        sectionData[sec].forEach(row => {
            let item = row.item.trim();
            if(!itemAggregates[item]) itemAggregates[item] = 0;
            itemAggregates[item] += Number(row.quantity);
        });
    });

    let aggregatedArray = Object.keys(itemAggregates).map(item => ({
        item: item,
        qty: itemAggregates[item]
    }));
    aggregatedArray.sort((a,b) => a.item.localeCompare(b.item));

    let bodyRows = [];
    aggregatedArray.forEach(data => {
        let timePerUnit = findTimeAllotted(data.item);
        let totalTime = (data.qty * timePerUnit);
        bodyRows.push([ data.item, "", "", "", data.qty.toString(), totalTime.toFixed(3) ]);
    });

    const toDateVal = document.getElementById('toDate').value;

    const mIndex = tDate.getMonth();

                { content: 'Description of Materials', rowSpan: 2, styles: { halign: 'center', valign: 'middle' } },
