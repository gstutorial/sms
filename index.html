<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
SMS Work Report Generator
</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

<meta name="theme-color"
content="#2563eb">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial,sans-serif;

    background:
    radial-gradient(
    circle at top,
    #1e3a8a 0%,
    #0f172a 40%,
    #020617 100%
    );

    min-height:100vh;

    padding:10px;

    color:white;

}

.container{

    width:100%;

    max-width:1500px;

    margin:auto;

    background:
    linear-gradient(
    135deg,
    rgba(255,255,255,0.10),
    rgba(255,255,255,0.04)
    );

    border-radius:30px;

    padding:18px;

    border:
    1px solid rgba(255,255,255,0.10);

    backdrop-filter:blur(20px);

    box-shadow:
    0 15px 50px rgba(0,0,0,0.45);

}

.logo{

    width:82px;

    height:82px;

    object-fit:contain;

    display:block;

    margin:auto;

}

.title{

    text-align:center;

    font-size:30px;

    font-weight:800;

    margin-top:10px;

}

.subtitle{

    text-align:center;

    color:#cbd5e1;

    margin-top:6px;

    margin-bottom:18px;

    font-size:14px;

}

.main-layout{

    display:flex;

    flex-direction:column;

    gap:18px;

}

.left-panel{

    width:100%;

}

.right-panel{

    width:100%;

}

.filter-box{

    background:
    rgba(255,255,255,0.06);

    border-radius:24px;

    padding:18px;

    border:
    1px solid rgba(255,255,255,0.08);

}

.input-group{

    margin-bottom:12px;

}

.input-label{

    display:block;

    margin-bottom:7px;

    font-size:13px;

    font-weight:700;

}

.date-input{

    width:100%;

    padding:13px;

    border:none;

    border-radius:15px;

    background:white;

    font-size:14px;

    font-weight:700;

    cursor:pointer;

}

.generate-btn{

    width:100%;

    border:none;

    border-radius:16px;

    padding:15px;

    background:
    linear-gradient(
    135deg,
    #2563eb,
    #06b6d4
    );

    color:white;

    font-size:16px;

    font-weight:800;

    cursor:pointer;

    margin-top:8px;

}

.loading{

    display:none;

    text-align:center;

    margin-top:15px;

    font-size:15px;

    font-weight:700;

}

.results{

    display:grid;

    grid-template-columns:1fr;

    gap:14px;

}

.section-card{

    background:
    linear-gradient(
    135deg,
    rgba(255,255,255,0.10),
    rgba(255,255,255,0.05)
    );

    border-radius:22px;

    padding:14px;

    border:
    1px solid rgba(255,255,255,0.10);

    transition:0.3s ease;

}

.section-card:hover{

    transform:translateY(-4px);

}

.section-header{

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:12px;

}

.section-icon{

    width:44px;

    height:44px;

    border-radius:50%;

    background:
    linear-gradient(
    135deg,
    #2563eb,
    #38bdf8
    );

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:18px;

}

.section-name{

    font-size:18px;

    font-weight:800;

}

.summary-grid{

    display:grid;

    grid-template-columns:1fr 1fr 1fr;

    gap:8px;

    margin-bottom:12px;

}

.summary-box{

    background:
    rgba(255,255,255,0.08);

    border-radius:14px;

    padding:10px;

    text-align:center;

}

.summary-number{

    font-size:18px;

    font-weight:900;

    color:#38bdf8;

}

.summary-label{

    font-size:10px;

    color:#cbd5e1;

    margin-top:2px;

}

.button-row{

    display:flex;

    gap:8px;

}

.download-btn,
.share-btn{

    flex:1;

    border:none;

    border-radius:12px;

    padding:11px;

    color:white;

    font-size:13px;

    font-weight:800;

    cursor:pointer;

}

.download-btn{

    background:
    linear-gradient(
    135deg,
    #16a34a,
    #22c55e
    );

}

.share-btn{

    background:
    linear-gradient(
    135deg,
    #2563eb,
    #38bdf8
    );

}

.all-card{

    background:
    linear-gradient(
    135deg,
    #7c3aed,
    #2563eb
    );

}

.footer{

    text-align:center;

    margin-top:22px;

    color:#cbd5e1;

    font-size:12px;

    line-height:1.6;

}

#toast{

    position:fixed;

    top:20px;

    left:50%;

    transform:translateX(-50%);

    background:
    linear-gradient(
    135deg,
    #111827,
    #1f2937
    );

    padding:14px 20px;

    border-radius:16px;

    color:white;

    font-weight:700;

    z-index:9999;

    display:none;

    min-width:260px;

    text-align:center;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.4);

}

@media(min-width:992px){

    .main-layout{

        display:grid;

        grid-template-columns:370px 1fr;

        gap:22px;

        align-items:start;

    }

    .left-panel{

        position:sticky;

        top:18px;

    }

    .results{

        grid-template-columns:1fr 1fr;

    }

}

</style>

</head>

<body>

<div class="container">

<img src="logo.png"
class="logo">

<div class="title">
SMS Work Report Generator
</div>

<div class="subtitle">
Generate Section Wise Work Reports
</div>

<div class="main-layout">

<div class="left-panel">

<div class="filter-box">

<div class="input-group">

<label class="input-label">
From Date
</label>

<input
type="date"
id="fromDate"
class="date-input"
onclick="this.showPicker()">

</div>

<div class="input-group">

<label class="input-label">
To Date
</label>

<input
type="date"
id="toDate"
class="date-input"
onclick="this.showPicker()">

</div>

<button class="generate-btn"
onclick="generateReports()">

📄 Generate Reports

</button>

</div>

<div class="loading"
id="loading">

Fetching Google Sheet Data...

</div>

</div>

<div class="right-panel">

<div class="results"
id="results">

</div>

</div>

</div>

<div class="footer">

Indian Railway Work Report System

<br>

App Created By Gobind Sharma

</div>

</div>

<div id="toast"></div>

<script>

const SHEET_URL =
'https://docs.google.com/spreadsheets/d/1OP1z06rCpFMTRiAwncFIWuHK_rB2y0acy3KDVDnZGvA/export?format=csv&gid=0';

let sectionData = {};

function showToast(message){

    const toast =
    document.getElementById('toast');

    toast.innerHTML = message;

    toast.style.display='block';

    clearTimeout(window.toastTimer);

    window.toastTimer =
    setTimeout(()=>{

        toast.style.display='none';

    },3000);

}

function formatDisplayDate(dateString){

    const date =
    new Date(dateString);

    const months = [

        'Jan','Feb','Mar',
        'Apr','May','Jun',
        'Jul','Aug','Sep',
        'Oct','Nov','Dec'

    ];

    return String(date.getDate())
    .padStart(2,'0')

    + '-'

    + months[date.getMonth()]

    + '-'

    + date.getFullYear();

}

async function fetchSheetData(){

    const response =
    await fetch(SHEET_URL);

    const csv =
    await response.text();

    const lines =
    csv.split('\n');

    const data = [];

    for(let i=1;i<lines.length;i++){

        const row =
        lines[i].split(',');

        if(row.length >= 5){

            data.push({

                date:
                row[0].replace(/"/g,'').trim(),

                section:
                row[1].replace(/"/g,'').trim(),

                item:
                row[2].replace(/"/g,'').trim(),

                quantity:
                Number(row[3].replace(/"/g,'').trim()),

                thickness:
                row[4].replace(/"/g,'').trim()

            });

        }

    }

    return data;

}

async function generateReports(){

    const fromDate =
    document.getElementById('fromDate').value;

    const toDate =
    document.getElementById('toDate').value;

    if(!fromDate || !toDate){

        showToast(
        'Please Select Date Range'
        );

        return;

    }

    const from =
    new Date(fromDate);

    const to =
    new Date(toDate);

    if(from > to){

        showToast(
        'From Date Must Be Smaller'
        );

        return;

    }

    document.getElementById('loading')
    .style.display='block';

    document.getElementById('results')
    .innerHTML='';

    const rows =
    await fetchSheetData();

    to.setHours(23,59,59,999);

    sectionData = {};

    rows.forEach(row=>{

        if(!row.date) return;

        const p =
        row.date.split('/');

        const rowDate =
        new Date(
            p[2],
            p[1]-1,
            p[0]
        );

        if(rowDate >= from && rowDate <= to){

            if(!sectionData[row.section]){

                sectionData[row.section]=[];

            }

            sectionData[row.section]
            .push(row);

        }

    });

    renderCards();

    document.getElementById('loading')
    .style.display='none';

    showToast(
    'Reports Generated Successfully'
    );

}

function renderCards(){

    const container =
    document.getElementById('results');

    container.innerHTML='';

    const allCard =
    document.createElement('div');

    allCard.className =
    'section-card all-card';

    allCard.innerHTML = `

    <div class="section-header">

        <div class="section-icon">
        📚
        </div>

        <div class="section-name">
        ALL SECTIONS
        </div>

    </div>

    <div class="button-row">

        <button class="download-btn"
        onclick="downloadAllPDF()">

        ⬇ Download

        </button>

        <button class="share-btn"
        onclick="shareAllPDF()">

        🔗 Share

        </button>

    </div>

    `;

    container.appendChild(allCard);

    Object.keys(sectionData).forEach(section=>{

        const rows =
        sectionData[section];

        let totalQty = 0;

        rows.forEach(r=>{

            totalQty += Number(r.quantity);

        });

        const uniqueItems =
        [...new Set(rows.map(r=>r.item))];

        const card =
        document.createElement('div');

        card.className =
        'section-card';

        card.innerHTML = `

        <div class="section-header">

            <div class="section-icon">
            📋
            </div>

            <div class="section-name">
            ${section}
            </div>

        </div>

        <div class="summary-grid">

            <div class="summary-box">

                <div class="summary-number">
                ${rows.length}
                </div>

                <div class="summary-label">
                Entries
                </div>

            </div>

            <div class="summary-box">

                <div class="summary-number">
                ${totalQty}
                </div>

                <div class="summary-label">
                Qty
                </div>

            </div>

            <div class="summary-box">

                <div class="summary-number">
                ${uniqueItems.length}
                </div>

                <div class="summary-label">
                Items
                </div>

            </div>

        </div>

        <div class="button-row">

            <button class="download-btn"
            onclick="downloadPDF('${section}')">

            ⬇ Download

            </button>

            <button class="share-btn"
            onclick="sharePDF('${section}')">

            🔗 Share

            </button>

        </div>

        `;

        container.appendChild(card);

    });

}

function createSectionPDF(doc, section, rows) {

    const fromDate = formatDisplayDate(document.getElementById('fromDate').value);
    const toDate = formatDisplayDate(document.getElementById('toDate').value);

    // Sort rows consistently by Date
    rows.sort((a,b)=>{
        const pa = a.date.split('/');
        const pb = b.date.split('/');
        return new Date(pa[2],pa[1]-1,pa[0]) - new Date(pb[2],pb[1]-1,pb[0]);
    });

    // 1. Prepare Summary Table Data
    const summary = {};
    rows.forEach(r => {
        const key = r.item + '|' + r.thickness;
        if(!summary[key]){ summary[key]=0; }
        summary[key] += Number(r.quantity);
    });
    
    const summaryRows = Object.keys(summary).map(key => {
        const p = key.split('|');
        return [p[0], p[1], summary[key]];
    });

    // 2. Prepare Detail Table Data (Grouped by Date)
    const bodyRows = [];
    let currentGroup = 0;
    let previousDate = '';

    rows.forEach(r => {
        let displayDate = formatDisplayDate(r.date.split('/').reverse().join('-'));
        let dateVal = '';

        if (r.date !== previousDate) {
            currentGroup++;
            dateVal = displayDate;
            previousDate = r.date;
        }

        bodyRows.push({
            row: [dateVal, r.item, r.thickness, r.qty],
            group: currentGroup
        });
    });

    // --- DRAW PAGE HEADERS ---
    doc.setFillColor(5,10,35);
    doc.rect(0,0,297,36,'F');

    try {
        const img = document.querySelector('.logo');
        if(img) {
            doc.addImage(img, 'PNG', 10, 5, 22, 22);
        }
    } catch(e) {}

    doc.setTextColor(255,255,255);
    doc.setFontSize(24);
    doc.setFont('helvetica', 'bold');
    doc.text('SMS WORK REPORT', 148, 15, {align:'center'});

    doc.setFontSize(10);
    doc.setTextColor(210,210,210);
    doc.text('App Created By Gobind Sharma', 148, 23, {align:'center'});

    doc.setFillColor(15,25,55);
    doc.roundedRect(10, 44, 277, 24, 7, 7, 'F');

    doc.setTextColor(180,190,210);
    doc.setFontSize(9);
    doc.text('SECTION', 18, 52);
    doc.text('FROM DATE', 118, 52);
    doc.text('TO DATE', 218, 52);

    doc.setTextColor(255,255,255);
    doc.setFontSize(14);
    doc.setFont('helvetica', 'bold');
    doc.text(section, 18, 62);
    doc.text(fromDate, 118, 62);
    doc.text(toDate, 218, 62);

    // Section Titles
    doc.setTextColor(25,35,55);
    doc.setFontSize(14);
    doc.text('Detail Work Report', 10, 84);
    doc.text('Item Summary', 160, 84);

    // --- DRAW DETAIL TABLE (LEFT SIDE) ---
    doc.autoTable({
        startY: 90,
        margin: { left: 10, right: 145 }, // Keeps it strictly on the left half
        head: [['Date', 'Item Description', 'Thickness', 'Qty']],
        body: bodyRows.map(r => r.row),
        theme: 'grid',
        styles: {
            fontSize: 8.7,
            cellPadding: 4,
            lineColor: [220, 220, 220],
            lineWidth: 0.25,
            valign: 'middle'
        },
        headStyles: {
            fillColor: [37, 99, 235], // Blue Header
            textColor: [255, 255, 255],
            fontStyle: 'bold',
            halign: 'center'
        },
        columnStyles: {
            0: { cellWidth: 28, halign: 'center', fontStyle: 'bold' },
            1: { cellWidth: 70 },
            2: { cellWidth: 25, halign: 'center' },
            3: { cellWidth: 15, halign: 'center', fontStyle: 'bold' }
        },
        didParseCell: function(data) {
            if (data.section === 'body') {
                const rowData = bodyRows[data.row.index];
                
                // Alternate color purely by Date Group
                const bgColor = rowData.group % 2 === 0 ? [248, 250, 255] : [238, 244, 255];
                data.cell.styles.fillColor = bgColor;
                
                // Emulate merged cells by hiding the top border of empty date strings
                if (data.column.index === 0 && rowData.row[0] === '') {
                    data.cell.styles.textColor = bgColor; 
                    data.cell.styles.lineWidth = { top: 0, bottom: 0, left: 0.25, right: 0.25 };
                    
                    // Restore bottom border if this is the last item in the group or table
                    if (data.row.index === bodyRows.length - 1 || 
                       (bodyRows[data.row.index + 1] && bodyRows[data.row.index + 1].row[0] !== '')) {
                         data.cell.styles.lineWidth.bottom = 0.25;
                    }
                }
            }
        }
    });

    // --- DRAW SUMMARY TABLE (RIGHT SIDE) ---
    // Reset back to page 1 so side-by-side renders properly even if Detail Table created new pages.
    doc.setPage(1); 

    doc.autoTable({
        startY: 90,
        margin: { left: 160, right: 10 }, // Keeps it strictly on the right half
        head: [['Item Description', 'Thickness', 'Total Qty']],
        body: summaryRows,
        theme: 'grid',
        styles: {
            fontSize: 8.7,
            cellPadding: 4,
            lineColor: [220, 220, 220],
            lineWidth: 0.25,
            valign: 'middle'
        },
        headStyles: {
            fillColor: [124, 58, 237], // Purple Header for distinction
            textColor: [255, 255, 255],
            fontStyle: 'bold',
            halign: 'center'
        },
        columnStyles: {
            0: { cellWidth: 67 },
            1: { cellWidth: 35, halign: 'center' },
            2: { cellWidth: 25, halign: 'center', fontStyle: 'bold' }
        },
        didParseCell: function(data) {
            if (data.section === 'body') {
                // Purple-tinted alternating rows
                const bgColor = data.row.index % 2 === 0 ? [250, 248, 255] : [243, 238, 255]; 
                data.cell.styles.fillColor = bgColor;
            }
        }
    });

    // --- DRAW FOOTERS (ALL PAGES) ---
    const pageCount = doc.internal.getNumberOfPages();
    const pageHeight = doc.internal.pageSize.height;
    
    for (let i = 1; i <= pageCount; i++) {
        doc.setPage(i);
        doc.setDrawColor(220, 220, 220);
        doc.line(10, pageHeight - 10, 287, pageHeight - 10);
        doc.setFontSize(9);
        doc.setTextColor(120, 120, 120);
        doc.text('Indian Railway Work Report System', 148, pageHeight - 4, { align: 'center' });
    }
}

async function createPDF(section){

    const { jsPDF } =
    window.jspdf;

    const doc =
    new jsPDF('landscape');

    createSectionPDF(
        doc,
        section,
        sectionData[section]
    );

    return doc.output('blob');

}

async function downloadPDF(section){

    const blob =
    await createPDF(section);

    const a =
    document.createElement('a');

    a.href =
    URL.createObjectURL(blob);

    a.download =
    section + '.pdf';

    a.click();

}

async function sharePDF(section){

    const blob =
    await createPDF(section);

    const file =
    new File(
        [blob],
        section + '.pdf',
        {
            type:'application/pdf'
        }
    );

    if(navigator.canShare &&
    navigator.canShare({files:[file]})){

        await navigator.share({

            files:[file]

        });

    }

    else{

        showToast(
        'Sharing Not Supported'
        );

    }

}

async function createAllPDF(){

    const { jsPDF } =
    window.jspdf;

    const doc =
    new jsPDF('landscape');

    const sections =
    Object.keys(sectionData);

    sections.forEach((section,index)=>{

        if(index !== 0){

            doc.addPage();

        }

        createSectionPDF(
            doc,
            section,
            sectionData[section]
        );

    });

    return doc.output('blob');

}

async function downloadAllPDF(){

    const blob =
    await createAllPDF();

    const a =
    document.createElement('a');

    a.href =
    URL.createObjectURL(blob);

    a.download =
    'All Sections Report.pdf';

    a.click();

}

async function shareAllPDF(){

    const blob =
    await createAllPDF();

    const file =
    new File(
        [blob],
        'All Sections Report.pdf',
        {
            type:'application/pdf'
        }
    );

    if(navigator.canShare &&
    navigator.canShare({files:[file]})){

        await navigator.share({

            files:[file]

        });

    }

    else{

        showToast(
        'Sharing Not Supported'
        );

    }

}

</script>

</body>

</html>
