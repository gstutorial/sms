<meta charset="UTF-8">

content="width=device-width, initial-scale=1.0">

SMS Work Report Generator

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial,sans-serif;

    background:
    radial-gradient(
    circle at top,
    #1e3a8a 0%,
    #0f172a 40%,
    #020617 100%
    );

    min-height:100vh;

    padding:10px;

    color:white;

}

.container{

    width:100%;

    max-width:1500px;

    margin:auto;

    background:
    linear-gradient(
    135deg,
    rgba(255,255,255,0.10),
    rgba(255,255,255,0.04)
    );

    border-radius:30px;

    padding:18px;

    border:
    1px solid rgba(255,255,255,0.10);

    backdrop-filter:blur(20px);

    box-shadow:
    0 15px 50px rgba(0,0,0,0.45);

}

.logo{

    width:82px;

    height:82px;

    object-fit:contain;

    display:block;

    margin:auto;

}

.title{

    text-align:center;

    font-size:30px;

    font-weight:800;

    margin-top:10px;

}

.subtitle{

    text-align:center;

    color:#cbd5e1;

    margin-top:6px;

    margin-bottom:18px;

    font-size:14px;

}

.main-layout{

    display:flex;

    flex-direction:column;

    gap:18px;

}

.left-panel{

    width:100%;

}

.right-panel{

    width:100%;

}

.filter-box{

    background:
    rgba(255,255,255,0.06);

    border-radius:24px;

    padding:18px;

    border:
    1px solid rgba(255,255,255,0.08);

}

.input-group{

    margin-bottom:12px;

}

.input-label{

    display:block;

    margin-bottom:7px;

    font-size:13px;

    font-weight:700;

}

.date-input{

    width:100%;

    padding:13px;

    border:none;

    border-radius:15px;

    background:white;

    font-size:14px;

    font-weight:700;

    cursor:pointer;

}

.generate-btn{

    width:100%;

    border:none;

    border-radius:16px;

    padding:15px;

    background:
    linear-gradient(
    135deg,
    #2563eb,
    #06b6d4
    );

    color:white;

    font-size:16px;

    font-weight:800;

    cursor:pointer;

    margin-top:8px;

}

.loading{

    display:none;

    text-align:center;

    margin-top:15px;

    font-size:15px;

    font-weight:700;

}

.results{

    display:grid;

    grid-template-columns:1fr;

    gap:14px;

}

.section-card{

    background:
    linear-gradient(
    135deg,
    rgba(255,255,255,0.10),
    rgba(255,255,255,0.05)
    );

    border-radius:22px;

    padding:14px;

    border:
    1px solid rgba(255,255,255,0.10);

    transition:0.3s ease;

}

.section-card:hover{

    transform:translateY(-4px);

}

.section-header{

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:12px;

}

.section-icon{

    width:44px;

    height:44px;

    border-radius:50%;

    background:
    linear-gradient(
    135deg,
    #2563eb,
    #38bdf8
    );

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:18px;

}

.section-name{

    font-size:18px;

    font-weight:800;

}

.summary-grid{

    display:grid;

    grid-template-columns:1fr 1fr 1fr;

    gap:8px;

    margin-bottom:12px;

}

.summary-box{

    background:
    rgba(255,255,255,0.08);

    border-radius:14px;

    padding:10px;

    text-align:center;

}

.summary-number{

    font-size:18px;

    font-weight:900;

    color:#38bdf8;

}

.summary-label{

    font-size:10px;

    color:#cbd5e1;

    margin-top:2px;

}

.button-row{

    display:flex;

    gap:8px;

}

.download-btn,
.share-btn{

    flex:1;

    border:none;

    border-radius:12px;

    padding:11px;

    color:white;

    font-size:13px;

    font-weight:800;

    cursor:pointer;

}

.download-btn{

    background:
    linear-gradient(
    135deg,
    #16a34a,
    #22c55e
    );

}

.share-btn{

    background:
    linear-gradient(
    135deg,
    #2563eb,
    #38bdf8
    );

}

.all-card{

    background:
    linear-gradient(
    135deg,
    #7c3aed,
    #2563eb
    );

}

.footer{

    text-align:center;

    margin-top:22px;

    color:#cbd5e1;

    font-size:12px;

    line-height:1.6;

}

#toast{

    position:fixed;

    top:20px;

    left:50%;

    transform:translateX(-50%);

    background:
    linear-gradient(
    135deg,
    #111827,
    #1f2937
    );

    padding:14px 20px;

    border-radius:16px;

    color:white;

    font-weight:700;

    z-index:9999;

    display:none;

    min-width:260px;

    text-align:center;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.4);

}

/* PWA Install Button Styles */
.install-fab {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: linear-gradient(135deg, #10b981, #059669);
    color: white;
    border: none;
    border-radius: 50px;
    padding: 14px 24px;
    font-size: 15px;
    font-weight: 800;
    box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    cursor: pointer;
    z-index: 1000;
    display: none; /* Hidden until PWA criteria met */
    align-items: center;
    gap: 8px;
    transition: 0.3s ease;
}

.install-fab:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
}

@media(min-width:992px){

    .main-layout{

        display:grid;

        grid-template-columns:370px 1fr;

        gap:22px;

        align-items:start;

    }

    .left-panel{

        position:sticky;

        top:18px;

    }

    .results{

        grid-template-columns:1fr 1fr;

    }

}

</style>

</head>

<body>

<div class="container">

<img src="logo.png"
class="logo">

<div class="title">
SMS Work Report Generator
</div>

<div class="subtitle">
Generate Section Wise Work Reports
</div>

<div class="main-layout">

<div class="left-panel">

<div class="filter-box">

<div class="input-group">

<label class="input-label">
From Date
</label>

<input
type="date"
id="fromDate"
class="date-input"
onclick="this.showPicker()">

</div>

<div class="input-group">

<label class="input-label">
To Date
</label>

<input
type="date"
id="toDate"
class="date-input"
onclick="this.showPicker()">

</div>

<button class="generate-btn"
onclick="generateReports()">

📄 Generate Reports

</button>

</div>

<div class="loading"
id="loading">

Fetching Google Sheet Data...

</div>

</div>

<div class="right-panel">

<div class="results"
id="results">

</div>

</div>

</div>

<div class="footer">

Indian Railway Work Report System

<br>

App Created By Gobind Sharma

</div>

</div>

<div id="toast"></div>

<button id="installAppBtn" class="install-fab">
    📲 Install App
</button>

<script>

const SHEET_URL =
'https://docs.google.com/spreadsheets/d/1OP1z06rCpFMTRiAwncFIWuHK_rB2y0acy3KDVDnZGvA/export?format=csv&gid=0';

let sectionData = {};

function showToast(message){

    const toast =
    document.getElementById('toast');

    toast.innerHTML = message;

    toast.style.display='block';

    clearTimeout(window.toastTimer);

    window.toastTimer =
    setTimeout(()=>{

        toast.style.display='none';

    },3000);

}

function formatDisplayDate(dateString){

    const date =
    new Date(dateString);

    const months = [

        'Jan','Feb','Mar',
        'Apr','May','Jun',
        'Jul','Aug','Sep',
        'Oct','Nov','Dec'

    ];

    return String(date.getDate())
    .padStart(2,'0')

    + '-'

    + months[date.getMonth()]

    + '-'

    + date.getFullYear();

}

async function fetchSheetData(){

    const response =
    await fetch(SHEET_URL);

    const csv =
    await response.text();

    const lines =
    csv.split('\n');

    const data = [];

    for(let i=1;i<lines.length;i++){

        const row =
        lines[i].split(',');

        if(row.length >= 5){

            data.push({

                date:
                row[0].replace(/"/g,'').trim(),

                section:
                row[1].replace(/"/g,'').trim(),

                item:
                row[2].replace(/"/g,'').trim(),

                quantity:
                Number(row[3].replace(/"/g,'').trim()),

                thickness:
                row[4].replace(/"/g,'').trim()

            });

        }

    }

    return data;

}

async function generateReports(){

    const fromDateVal =
    document.getElementById('fromDate').value;

    const toDateVal =
    document.getElementById('toDate').value;

    if(!fromDateVal || !toDateVal){

        showToast(
        'Please Select Date Range'
        );

        return;

    }

    const fParts = fromDateVal.split('-');
    const from = new Date(fParts[0], fParts[1] - 1, fParts[2]);

    const tParts = toDateVal.split('-');
    const to = new Date(tParts[0], tParts[1] - 1, tParts[2]);
    
    to.setHours(23, 59, 59, 999);

    if(from > to){

        showToast(
        'From Date Must Be Smaller'
        );

        return;

    }

    document.getElementById('loading')
    .style.display='block';

    document.getElementById('results')
    .innerHTML='';

    const rows =
    await fetchSheetData();

    sectionData = {};

    rows.forEach(row=>{

        if(!row.date) return;

        const p =
        row.date.split('/');

        const rowDate =
        new Date(
            p[2],
            p[1]-1,
            p[0]
        );

        if(rowDate >= from && rowDate <= to){

            if(!sectionData[row.section]){

                sectionData[row.section]=[];

            }

            sectionData[row.section]
            .push(row);

        }

    });

    renderCards();

    document.getElementById('loading')
    .style.display='none';

    showToast(
    'Reports Generated Successfully'
    );

}

function renderCards(){

    const container =
    document.getElementById('results');

    container.innerHTML='';

    const allCard =
    document.createElement('div');

    allCard.className =
    'section-card all-card';

    allCard.innerHTML = `

    <div class="section-header">

        <div class="section-icon">
        📚
        </div>

        <div class="section-name">
        ALL SECTIONS
        </div>

    </div>

    <div class="button-row">

        <button class="download-btn"
        onclick="downloadAllPDF()">

        ⬇ Download

        </button>

        <button class="share-btn"
        onclick="shareAllPDF()">

        🔗 Share

        </button>

    </div>

    `;

    container.appendChild(allCard);

    Object.keys(sectionData).forEach(section=>{

        const rows =
        sectionData[section];

        let totalQty = 0;

        rows.forEach(r=>{

            totalQty += Number(r.quantity);

        });

        const uniqueItems =
        [...new Set(rows.map(r=>r.item))];

        const card =
        document.createElement('div');

        card.className =
        'section-card';

        card.innerHTML = `

        <div class="section-header">

            <div class="section-icon">
            📋
            </div>

            <div class="section-name">
            ${section}
            </div>

        </div>

        <div class="summary-grid">

            <div class="summary-box">

                <div class="summary-number">
                ${rows.length}
                </div>

                <div class="summary-label">
                Entries
                </div>

            </div>

            <div class="summary-box">

                <div class="summary-number">
                ${totalQty}
                </div>

                <div class="summary-label">
                Qty
                </div>

            </div>

            <div class="summary-box">

                <div class="summary-number">
                ${uniqueItems.length}
                </div>

                <div class="summary-label">
                Items
                </div>

            </div>

        </div>

        <div class="button-row">

            <button class="download-btn"
            onclick="downloadPDF('${section}')">

            ⬇ Download

            </button>

            <button class="share-btn"
            onclick="sharePDF('${section}')">

            🔗 Share

            </button>

        </div>

        `;

        container.appendChild(card);

    });

}

function createSectionPDF(doc, section, rows) {

    const fromDateVal = document.getElementById('fromDate').value;
    const fParts = fromDateVal.split('-');
    const fromDate = formatDisplayDate(`${fParts[0]}-${fParts[1]}-${fParts[2]}T00:00:00`);

    const toDateVal = document.getElementById('toDate').value;
    const tParts = toDateVal.split('-');
    const toDate = formatDisplayDate(`${tParts[0]}-${tParts[1]}-${tParts[2]}T00:00:00`);
    
    const startPage = doc.internal.getCurrentPageInfo().pageNumber;

    rows.sort((a,b)=>{
        const pa = a.date.split('/');
        const pb = b.date.split('/');
        return new Date(pa[2],pa[1]-1,pa[0]) - new Date(pb[2],pb[1]-1,pb[0]);
    });

    const summary = {};
    rows.forEach(r => {
        const key = r.item + '|' + r.thickness;
        if(!summary[key]){ summary[key]=0; }
        summary[key] += Number(r.quantity);
    });
    
    const summaryRows = Object.keys(summary).map(key => {
        const p = key.split('|');
        return [p[0], p[1], summary[key]];
    });

    const dateCounts = {};
    rows.forEach(r => {
        dateCounts[r.date] = (dateCounts[r.date] || 0) + 1;
    });

    const bodyRows = [];
    let currentGroup = -1;
    let previousDate = '';

    rows.forEach(r => {
        let displayDate = formatDisplayDate(r.date.split('/').reverse().join('-') + 'T00:00:00');

        if (r.date !== previousDate) {
            currentGroup++;
            bodyRows.push({
                row: [
                    { content: displayDate, rowSpan: dateCounts[r.date], styles: { valign: 'middle', halign: 'center', fontStyle: 'bold' } },
                    r.item,
                    r.thickness,
                    r.quantity
                ],
                group: currentGroup
            });
            previousDate = r.date;
        } else {
            bodyRows.push({
                row: [
                    r.item,
                    r.thickness,
                    r.quantity
                ],
                group: currentGroup
            });
        }
    });

    doc.setTextColor(25, 35, 55);
    doc.setFontSize(13);
    doc.setFont('helvetica', 'bold');
    doc.text('Detail Work Report', 3, 46);
    doc.text('Item Summary', 126, 46);

    doc.autoTable({
        startY: 48,
        margin: { top: 48, bottom: 15, left: 3, right: 87 }, 
        head: [['Date', 'Description', 'Thick.', 'Qty']],
        body: bodyRows.map(r => r.row),
        theme: 'grid',
        styles: {
            fontSize: 7.5,
            cellPadding: 2.5,
            lineColor: [200, 200, 200],
            lineWidth: 0.1,
            valign: 'middle'
        },
        headStyles: {
            textColor: [255, 255, 255],
            fontStyle: 'bold',
            halign: 'center'
        },
        columnStyles: {
            0: { cellWidth: 22, halign: 'center', fontStyle: 'bold' },
            1: { cellWidth: 65 }, 
            2: { cellWidth: 18, halign: 'center' },
            3: { cellWidth: 15, halign: 'center', fontStyle: 'bold' }
        },
        didParseCell: function(data) {
            if (data.section === 'head') {
                data.cell.styles.fillColor = null; 
            }
            if (data.section === 'body') {
                const rowData = bodyRows[data.row.index];
                const bgColor = rowData.group % 2 === 0 ? [255, 255, 255] : [235, 243, 255]; 
                data.cell.styles.fillColor = bgColor;
            }
        },
        willDrawCell: function(data) {
            if (data.section === 'head') {
                const { x, y, width, height } = data.cell;
                for (let i = 0; i <= height; i += 0.5) {
                    let ratio = i / height;
                    let r = Math.round(15 + (30 - 15) * ratio); 
                    let g = Math.round(23 + (58 - 23) * ratio); 
                    let b = Math.round(42 + (138 - 42) * ratio); 
                    doc.setFillColor(r, g, b);
                    doc.rect(x, y + i, width, 0.6, 'F');
                }
            }
        }
    });

    doc.setPage(startPage); 

    doc.autoTable({
        startY: 48,
        margin: { top: 48, bottom: 15, left: 126, right: 3 },
        head: [['Item Description', 'Thick.', 'Total Qty']],
        body: summaryRows,
        theme: 'grid',
        styles: {
            fontSize: 7.5,
            cellPadding: 2.5,
            lineColor: [200, 200, 200],
            lineWidth: 0.1,
            valign: 'middle'
        },
        headStyles: {
            textColor: [255, 255, 255],
            fontStyle: 'bold',
            halign: 'center'
        },
        columnStyles: {
            0: { cellWidth: 46 }, 
            1: { cellWidth: 18, halign: 'center' },
            2: { cellWidth: 17, halign: 'center', fontStyle: 'bold' }
        },
        didParseCell: function(data) {
            if (data.section === 'head') {
                data.cell.styles.fillColor = null; 
            }
            if (data.section === 'body') {
                const bgColor = data.row.index % 2 === 0 ? [255, 255, 255] : [240, 248, 245]; 
                data.cell.styles.fillColor = bgColor;
            }
        },
        willDrawCell: function(data) {
            if (data.section === 'head') {
                const { x, y, width, height } = data.cell;
                for (let i = 0; i <= height; i += 0.5) {
                    let ratio = i / height;
                    let r = Math.round(2 + (4 - 2) * ratio);   
                    let g = Math.round(44 + (120 - 44) * ratio); 
                    let b = Math.round(34 + (87 - 34) * ratio);  
                    doc.setFillColor(r, g, b);
                    doc.rect(x, y + i, width, 0.6, 'F');
                }
            }
        }
    });

    const endPage = doc.internal.getNumberOfPages();
    const pageHeight = doc.internal.pageSize.height;
    
    for (let i = startPage; i <= endPage; i++) {
        doc.setPage(i);
        
        const headerHeight = 36;
        for (let y = 0; y <= headerHeight; y += 0.5) {
            let ratio = y / headerHeight;
            let r = Math.round(15 + (13 - 15) * ratio);
            let g = Math.round(23 + (148 - 23) * ratio);
            let b = Math.round(42 + (136 - 42) * ratio);
            doc.setFillColor(r, g, b);
            doc.rect(0, y, 210, 0.6, 'F'); 
        }

        try {
            const img = document.querySelector('.logo');
            if(img) {
                doc.addImage(img, 'PNG', 3, 4, 28, 28);
            }
        } catch(e) {}

        doc.setTextColor(255, 255, 255);
        doc.setFontSize(22);
        doc.setFont('helvetica', 'bold');
        doc.text('SMS WORK REPORT', 105, 14, {align:'center'});

        doc.setFontSize(9);
        doc.setTextColor(220, 230, 240);
        doc.setFont('helvetica', 'normal');
        doc.text('App Created By Gobind Sharma', 105, 20, {align:'center'});

        doc.setFontSize(10);
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(255, 255, 255);
        const infoText = `SECTION: ${section}     |     FROM: ${fromDate}     |     TO: ${toDate}`;
        doc.text(infoText, 105, 30, {align:'center'});

        doc.setDrawColor(220, 220, 220);
        doc.setLineWidth(0.5);
        doc.line(3, pageHeight - 10, 207, pageHeight - 10);
        doc.setFontSize(9);
        doc.setTextColor(120, 120, 120);
        doc.setFont('helvetica', 'normal');
        doc.text('Indian Railway Work Report System', 105, pageHeight - 4, { align: 'center' });
    }
}

async function createPDF(section){

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('portrait');
    createSectionPDF(doc, section, sectionData[section]);
    return doc.output('blob');

}

async function downloadPDF(section){

    const blob = await createPDF(section);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = section + '.pdf';
    a.click();

}

async function sharePDF(section){

    const blob = await createPDF(section);
    const file = new File([blob], section + '.pdf', { type:'application/pdf' });
    if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({ files:[file] });
    } else {
        showToast('Sharing Not Supported');
    }

}

async function createAllPDF(){

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('portrait');
    const sections = Object.keys(sectionData);

    sections.forEach((section,index)=>{
        if(index !== 0){
            doc.addPage();
        }
        createSectionPDF(doc, section, sectionData[section]);
    });

    return doc.output('blob');

}

async function downloadAllPDF(){

    const blob = await createAllPDF();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'All Sections Report.pdf';
    a.click();

}

async function shareAllPDF(){

    const blob = await createAllPDF();
    const file = new File([blob], 'All Sections Report.pdf', { type:'application/pdf' });
    if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({ files:[file] });
    } else {
        showToast('Sharing Not Supported');
    }

}

// ==========================================
// PWA Installation Scripts
// ==========================================

let deferredPrompt;
const installBtn = document.getElementById('installAppBtn');

window.addEventListener('beforeinstallprompt', (e) => {
    // Prevent the mini-infobar from appearing on mobile
    e.preventDefault();
    // Stash the event so it can be triggered later.
    deferredPrompt = e;
    // Update UI notify the user they can install the PWA
    installBtn.style.display = 'flex';
});

installBtn.addEventListener('click', async () => {
    // Hide the app provided install promotion
    installBtn.style.display = 'none';
    // Show the install prompt
    deferredPrompt.prompt();
    // Wait for the user to respond to the prompt
    const { outcome } = await deferredPrompt.userChoice;
    // We've used the prompt, and can't use it again, throw it away
    deferredPrompt = null;
});

window.addEventListener('appinstalled', () => {
    // Clear the deferredPrompt so it can be garbage collected
    deferredPrompt = null;
    showToast('App Installed Successfully!');
});

// Register Service Worker
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => {
            console.log('SW registration failed:', err);
        });
    });
}

</script>
