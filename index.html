<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
SMS Work Report Generator
</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

<meta name="theme-color"
content="#2563eb">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial,sans-serif;

    background:
    radial-gradient(
    circle at top,
    #1e3a8a 0%,
    #0f172a 40%,
    #020617 100%
    );

    min-height:100vh;

    padding:10px;

    color:white;

}

.container{

    width:100%;

    max-width:1500px;

    margin:auto;

    background:
    linear-gradient(
    135deg,
    rgba(255,255,255,0.10),
    rgba(255,255,255,0.04)
    );

    border-radius:30px;

    padding:18px;

    border:
    1px solid rgba(255,255,255,0.10);

    backdrop-filter:blur(20px);

    box-shadow:
    0 15px 50px rgba(0,0,0,0.45);

}

.logo{

    width:82px;

    height:82px;

    object-fit:contain;

    display:block;

    margin:auto;

}

.title{

    text-align:center;

    font-size:30px;

    font-weight:800;

    margin-top:10px;

}

.subtitle{

    text-align:center;

    color:#cbd5e1;

    margin-top:6px;

    margin-bottom:18px;

    font-size:14px;

}

.main-layout{

    display:flex;

    flex-direction:column;

    gap:18px;

}

.left-panel{

    width:100%;

}

.right-panel{

    width:100%;

}

.filter-box{

    background:
    rgba(255,255,255,0.06);

    border-radius:24px;

    padding:18px;

    border:
    1px solid rgba(255,255,255,0.08);

}

.input-group{

    margin-bottom:12px;

}

.input-label{

    display:block;

    margin-bottom:7px;

    font-size:13px;

    font-weight:700;

}

.date-input{

    width:100%;

    padding:13px;

    border:none;

    border-radius:15px;

    background:white;

    font-size:14px;

    font-weight:700;

    cursor:pointer;

}

.generate-btn{

    width:100%;

    border:none;

    border-radius:16px;

    padding:15px;

    background:
    linear-gradient(
    135deg,
    #2563eb,
    #06b6d4
    );

    color:white;

    font-size:16px;

    font-weight:800;

    cursor:pointer;

    margin-top:8px;

}

.loading{

    display:none;

    text-align:center;

    margin-top:15px;

    font-size:15px;

    font-weight:700;

}

.results{

    display:grid;

    grid-template-columns:1fr;

    gap:14px;

}

.section-card{

    background:
    linear-gradient(
    135deg,
    rgba(255,255,255,0.10),
    rgba(255,255,255,0.05)
    );

    border-radius:22px;

    padding:14px;

    border:
    1px solid rgba(255,255,255,0.10);

    transition:0.3s ease;

}

.section-card:hover{

    transform:translateY(-4px);

}

.section-header{

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:12px;

}

.section-icon{

    width:44px;

    height:44px;

    border-radius:50%;

    background:
    linear-gradient(
    135deg,
    #2563eb,
    #38bdf8
    );

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:18px;

}

.section-name{

    font-size:18px;

    font-weight:800;

}

.summary-grid{

    display:grid;

    grid-template-columns:1fr 1fr 1fr;

    gap:8px;

    margin-bottom:12px;

}

.summary-box{

    background:
    rgba(255,255,255,0.08);

    border-radius:14px;

    padding:10px;

    text-align:center;

}

.summary-number{

    font-size:18px;

    font-weight:900;

    color:#38bdf8;

}

.summary-label{

    font-size:10px;

    color:#cbd5e1;

    margin-top:2px;

}

.button-row{

    display:flex;

    gap:8px;

}

.download-btn,
.share-btn{

    flex:1;

    border:none;

    border-radius:12px;

    padding:11px;

    color:white;

    font-size:13px;

    font-weight:800;

    cursor:pointer;

}

.download-btn{

    background:
    linear-gradient(
    135deg,
    #16a34a,
    #22c55e
    );

}

.share-btn{

    background:
    linear-gradient(
    135deg,
    #2563eb,
    #38bdf8
    );

}

.all-card{

    background:
    linear-gradient(
    135deg,
    #7c3aed,
    #2563eb
    );

}

.footer{

    text-align:center;

    margin-top:22px;

    color:#cbd5e1;

    font-size:12px;

    line-height:1.6;

}

#toast{

    position:fixed;

    top:20px;

    left:50%;

    transform:translateX(-50%);

    background:
    linear-gradient(
    135deg,
    #111827,
    #1f2937
    );

    padding:14px 20px;

    border-radius:16px;

    color:white;

    font-weight:700;

    z-index:9999;

    display:none;

    min-width:260px;

    text-align:center;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.4);

}

@media(min-width:992px){

    .main-layout{

        display:grid;

        grid-template-columns:370px 1fr;

        gap:22px;

        align-items:start;

    }

    .left-panel{

        position:sticky;

        top:18px;

    }

    .results{

        grid-template-columns:1fr 1fr;

    }

}

</style>

</head>

<body>

<div class="container">

<img src="logo.png"
class="logo">

<div class="title">
SMS Work Report Generator
</div>

<div class="subtitle">
Generate Section Wise Work Reports
</div>

<div class="main-layout">

<div class="left-panel">

<div class="filter-box">

<div class="input-group">

<label class="input-label">
From Date
</label>

<input
type="date"
id="fromDate"
class="date-input"
onclick="this.showPicker()">

</div>

<div class="input-group">

<label class="input-label">
To Date
</label>

<input
type="date"
id="toDate"
class="date-input"
onclick="this.showPicker()">

</div>

<button class="generate-btn"
onclick="generateReports()">

📄 Generate Reports

</button>

</div>

<div class="loading"
id="loading">

Fetching Google Sheet Data...

</div>

</div>

<div class="right-panel">

<div class="results"
id="results">

</div>

</div>

</div>

<div class="footer">

Indian Railway Work Report System

<br>

App Created By Gobind Sharma

</div>

</div>

<div id="toast"></div>

<script>

const SHEET_URL =
'https://docs.google.com/spreadsheets/d/1OP1z06rCpFMTRiAwncFIWuHK_rB2y0acy3KDVDnZGvA/export?format=csv&gid=0';

let sectionData = {};

function showToast(message){

    const toast =
    document.getElementById('toast');

    toast.innerHTML = message;

    toast.style.display='block';

    clearTimeout(window.toastTimer);

    window.toastTimer =
    setTimeout(()=>{

        toast.style.display='none';

    },3000);

}

async function fetchSheetData(){

    const response =
    await fetch(SHEET_URL);

    const csv =
    await response.text();

    const lines =
    csv.split('\n');

    const data = [];

    for(let i=1;i<lines.length;i++){

        const row =
        lines[i].split(',');

        if(row.length >= 5){

            data.push({

                date:
                row[0].replace(/"/g,'').trim(),

                section:
                row[1].replace(/"/g,'').trim(),

                item:
                row[2].replace(/"/g,'').trim(),

                quantity:
                Number(row[3].replace(/"/g,'').trim()),

                thickness:
                row[4].replace(/"/g,'').trim()

            });

        }

    }

    return data;

}

async function generateReports(){

    const fromDate =
    document.getElementById('fromDate').value;

    const toDate =
    document.getElementById('toDate').value;

    if(!fromDate || !toDate){

        showToast(
        'Please Select Date Range'
        );

        return;

    }

    const from =
    new Date(fromDate);

    const to =
    new Date(toDate);

    if(from > to){

        showToast(
        'From Date Must Be Smaller'
        );

        return;

    }

    document.getElementById('loading')
    .style.display='block';

    document.getElementById('results')
    .innerHTML='';

    const rows =
    await fetchSheetData();

    to.setHours(23,59,59,999);

    sectionData = {};

    rows.forEach(row=>{

        if(!row.date) return;

        const p =
        row.date.split('/');

        const rowDate =
        new Date(
            p[2],
            p[1]-1,
            p[0]
        );

        if(rowDate >= from && rowDate <= to){

            if(!sectionData[row.section]){

                sectionData[row.section]=[];

            }

            sectionData[row.section]
            .push(row);

        }

    });

    renderCards();

    document.getElementById('loading')
    .style.display='none';

    showToast(
    'Reports Generated Successfully'
    );

}

function renderCards(){

    const container =
    document.getElementById('results');

    container.innerHTML='';

    const allCard =
    document.createElement('div');

    allCard.className =
    'section-card all-card';

    allCard.innerHTML = `

    <div class="section-header">

        <div class="section-icon">
        📚
        </div>

        <div class="section-name">
        ALL SECTIONS
        </div>

    </div>

    <div class="button-row">

        <button class="download-btn"
        onclick="downloadAllPDF()">

        ⬇ Download

        </button>

        <button class="share-btn"
        onclick="shareAllPDF()">

        🔗 Share

        </button>

    </div>

    `;

    container.appendChild(allCard);

    Object.keys(sectionData).forEach(section=>{

        const rows =
        sectionData[section];

        let totalQty = 0;

        rows.forEach(r=>{

            totalQty += Number(r.quantity);

        });

        const uniqueItems =
        [...new Set(rows.map(r=>r.item))];

        const card =
        document.createElement('div');

        card.className =
        'section-card';

        card.innerHTML = `

        <div class="section-header">

            <div class="section-icon">
            📋
            </div>

            <div class="section-name">
            ${section}
            </div>

        </div>

        <div class="summary-grid">

            <div class="summary-box">

                <div class="summary-number">
                ${rows.length}
                </div>

                <div class="summary-label">
                Entries
                </div>

            </div>

            <div class="summary-box">

                <div class="summary-number">
                ${totalQty}
                </div>

                <div class="summary-label">
                Qty
                </div>

            </div>

            <div class="summary-box">

                <div class="summary-number">
                ${uniqueItems.length}
                </div>

                <div class="summary-label">
                Items
                </div>

            </div>

        </div>

        <div class="button-row">

            <button class="download-btn"
            onclick="downloadPDF('${section}')">

            ⬇ Download

            </button>

            <button class="share-btn"
            onclick="sharePDF('${section}')">

            🔗 Share

            </button>

        </div>

        `;

        container.appendChild(card);

    });

}

function createSectionPDF(doc,section,rows){

    const fromDate =
    document.getElementById('fromDate').value;

    const toDate =
    document.getElementById('toDate').value;

    rows.sort((a,b)=>{

        const pa = a.date.split('/');
        const pb = b.date.split('/');

        return new Date(pa[2],pa[1]-1,pa[0]) -
        new Date(pb[2],pb[1]-1,pb[0]);

    });

    const summary = {};

    rows.forEach(r=>{

        const key =
        r.item + '|' + r.thickness;

        if(!summary[key]){

            summary[key]=0;

        }

        summary[key] += Number(r.quantity);

    });

    const summaryRows =
    Object.keys(summary)
    .map(key=>{

        const p = key.split('|');

        return [

            p[0],
            p[1],
            summary[key]

        ];

    });

    const detailRows = [];

    let lastDate='';

    rows.forEach(r=>{

        let dateText='';

        if(r.date !== lastDate){

            dateText = r.date;

            lastDate = r.date;

        }

        detailRows.push([

            dateText,
            r.item,
            r.thickness,
            r.quantity

        ]);

    });

    /* HEADER */

    doc.setFillColor(15,23,42);

    doc.rect(0,0,297,38,'F');

    try{

        const img =
        document.querySelector('.logo');

        doc.addImage(
        img,
        'PNG',
        10,
        7,
        20,
        20
        );

    }catch(e){}

    doc.setTextColor(255,255,255);

    doc.setFontSize(24);

    doc.text(
    'SMS WORK REPORT',
    148,
    15,
    {align:'center'}
    );

    doc.setFontSize(10);

    doc.text(
    'App Created By Gobind Sharma',
    148,
    23,
    {align:'center'}
    );

    /* HEADER CARDS */

    doc.setFillColor(30,41,59);

    doc.roundedRect(
    10,
    45,
    277,
    24,
    6,
    6,
    'F'
    );

    doc.setTextColor(255,255,255);

    doc.setFontSize(11);

    doc.text(
    'SECTION',
    18,
    54
    );

    doc.text(
    'FROM DATE',
    120,
    54
    );

    doc.text(
    'TO DATE',
    220,
    54
    );

    doc.setFontSize(14);

    doc.setFont(
    'helvetica',
    'bold'
    );

    doc.text(
    section,
    18,
    64
    );

    doc.text(
    fromDate,
    120,
    64
    );

    doc.text(
    toDate,
    220,
    64
    );

    /* TABLE CARDS */

    doc.setFillColor(248,250,252);

    doc.roundedRect(
    8,
    76,
    168,
    118,
    6,
    6,
    'F'
    );

    doc.roundedRect(
    182,
    76,
    107,
    118,
    6,
    6,
    'F'
    );

    doc.setTextColor(30,41,59);

    doc.setFontSize(14);

    doc.text(
    'Detail Work Report',
    14,
    86
    );

    doc.text(
    'Item Summary',
    188,
    86
    );

    /* DETAIL TABLE */

    doc.autoTable({

        startY:92,

        margin:{left:12},

        tableWidth:160,

        head:[[
            'Date',
            'Item',
            'Thickness',
            'Qty'
        ]],

        body:detailRows,

        theme:'grid',

        styles:{

            fontSize:9,

            cellPadding:4,

            valign:'middle',

            lineColor:[230,230,230],

            lineWidth:0.3

        },

        alternateRowStyles:{

            fillColor:[248,250,252]

        },

        headStyles:{

            fillColor:[37,99,235],

            halign:'center',

            fontStyle:'bold'

        },

        columnStyles:{

            0:{
                halign:'center',
                cellWidth:30
            },

            1:{
                cellWidth:78
            },

            2:{
                halign:'center',
                cellWidth:28
            },

            3:{
                halign:'center',
                cellWidth:20
            }

        }

    });

    /* SUMMARY TABLE */

    doc.autoTable({

        startY:92,

        margin:{left:186},

        tableWidth:98,

        head:[[
            'Item',
            'Thk',
            'Qty'
        ]],

        body:summaryRows,

        theme:'grid',

        styles:{

            fontSize:9,

            cellPadding:4,

            lineColor:[230,230,230],

            lineWidth:0.3

        },

        alternateRowStyles:{

            fillColor:[248,250,252]

        },

        headStyles:{

            fillColor:[124,58,237],

            halign:'center',

            fontStyle:'bold'

        },

        columnStyles:{

            0:{
                cellWidth:58
            },

            1:{
                halign:'center',
                cellWidth:18
            },

            2:{
                halign:'center',
                cellWidth:18
            }

        }

    });

}

async function createPDF(section){

    const { jsPDF } =
    window.jspdf;

    const doc =
    new jsPDF('landscape');

    createSectionPDF(
        doc,
        section,
        sectionData[section]
    );

    return doc.output('blob');

}

async function downloadPDF(section){

    const blob =
    await createPDF(section);

    const a =
    document.createElement('a');

    a.href =
    URL.createObjectURL(blob);

    a.download =
    section + '.pdf';

    a.click();

}

async function sharePDF(section){

    const blob =
    await createPDF(section);

    const file =
    new File(
        [blob],
        section + '.pdf',
        {
            type:'application/pdf'
        }
    );

    if(navigator.canShare &&
    navigator.canShare({files:[file]})){

        await navigator.share({

            files:[file]

        });

    }

    else{

        showToast(
        'Sharing Not Supported'
        );

    }

}

async function createAllPDF(){

    const { jsPDF } =
    window.jspdf;

    const doc =
    new jsPDF('landscape');

    const sections =
    Object.keys(sectionData);

    sections.forEach((section,index)=>{

        if(index !== 0){

            doc.addPage();

        }

        createSectionPDF(
            doc,
            section,
            sectionData[section]
        );

    });

    return doc.output('blob');

}

async function downloadAllPDF(){

    const blob =
    await createAllPDF();

    const a =
    document.createElement('a');

    a.href =
    URL.createObjectURL(blob);

    a.download =
    'All Sections Report.pdf';

    a.click();

}

async function shareAllPDF(){

    const blob =
    await createAllPDF();

    const file =
    new File(
        [blob],
        'All Sections Report.pdf',
        {
            type:'application/pdf'
        }
    );

    if(navigator.canShare &&
    navigator.canShare({files:[file]})){

        await navigator.share({

            files:[file]

        });

    }

    else{

        showToast(
        'Sharing Not Supported'
        );

    }

}

</script>

</body>

</html>
